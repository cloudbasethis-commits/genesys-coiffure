  <style>
    /* ============ EXPLORE — 3D immersive panorama ============ */
    .exp-body { height: 100%; overflow: hidden; background: var(--noir); }
    html, body { height: 100%; }

    .stage {
      position: fixed; inset: 0; overflow: hidden; background: var(--noir);
      touch-action: none; cursor: grab;
      -webkit-user-select: none; user-select: none;
    }
    .stage.is-grabbing { cursor: grabbing; }
    #scene { position: absolute; inset: 0; z-index: 1; }
    #scene canvas { display: block; width: 100% !important; height: 100% !important; }

    .hotspots { position: absolute; inset: 0; z-index: 5; pointer-events: none; }

    .stage__veil {
      position: absolute; inset: 0; pointer-events: none; z-index: 3;
      background:
        linear-gradient(to bottom, rgba(11,11,12,.5) 0%, rgba(11,11,12,0) 22%, rgba(11,11,12,0) 60%, rgba(11,11,12,.55) 85%, rgba(11,11,12,1) 100%);
    }
    .stage__edge {
      position: absolute; top: 0; bottom: 0; width: 13vw; max-width: 170px; pointer-events: none; z-index: 3;
    }
    .stage__edge--l { left: 0;  background: linear-gradient(to right, rgba(11,11,12,.5), transparent); }
    .stage__edge--r { right: 0; background: linear-gradient(to left,  rgba(11,11,12,.5), transparent); }

    /* ---- Hotspots (positioned by JS projection) ---- */
    .hs {
      position: absolute; top: 0; left: 0; z-index: 5;
      width: 48px; height: 48px; margin: -24px 0 0 -24px;
      display: grid; place-items: center; color: var(--ivory); white-space: normal;
      pointer-events: auto; will-change: transform; transform: translate3d(-200px,-200px,0);
    }
    .hs.is-hidden { opacity: 0; pointer-events: none; }
    .hs__dot {
      position: relative; width: 18px; height: 18px; border-radius: 50%;
      background: var(--grad-gold);
      box-shadow: 0 0 0 3px rgba(10,10,11,.55), 0 0 0 4px rgba(236,214,163,.7),
                  0 0 16px 2px rgba(200,161,91,.4), 0 4px 14px rgba(0,0,0,.55);
      transition: transform .35s var(--ease);
    }
    .hs__dot::before, .hs__dot::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--gold-soft);
    }
    .hs__dot::before { animation: hsPulse 2.6s var(--ease) infinite; }
    .hs__dot::after  { animation: hsPulse 2.6s var(--ease) infinite 1.3s; }
    @keyframes hsPulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3.1); opacity: 0; } }
    /* permanent title label under each point */
    .hs__label {
      position: absolute; top: calc(50% + 19px); left: 50%; transform: translateX(-50%) translateY(2px);
      white-space: nowrap; pointer-events: none;
      font-family: var(--font-display); font-weight: 500; font-size: .98rem; line-height: 1; color: var(--gold-bright);
      padding: 8px 14px; border-radius: 4px;
      background: rgba(8,8,9,.88); border: 1px solid rgba(200,161,91,.6);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,.65), 0 0 0 4px rgba(10,10,11,.3); text-shadow: 0 1px 8px rgba(0,0,0,.8);
      transition: color .3s var(--ease), border-color .3s var(--ease), background .3s var(--ease), transform .3s var(--ease);
    }
    .hs__label::before {
      content: ""; position: absolute; left: 50%; top: -5px; transform: translateX(-50%) rotate(45deg);
      width: 8px; height: 8px; background: rgba(8,8,9,.88);
      border-left: 1px solid rgba(200,161,91,.6); border-top: 1px solid rgba(200,161,91,.6);
    }
    /* Label flipped ABOVE the dot — for very low hotspots (e.g. the magazine) */
    .hs--up .hs__label { top: auto; bottom: calc(50% + 19px); }
    .hs--up .hs__label::before {
      top: auto; bottom: -5px;
      border-left: none; border-top: none;
      border-right: 1px solid rgba(200,161,91,.6); border-bottom: 1px solid rgba(200,161,91,.6);
    }
    .hs:hover .hs__dot, .hs:focus-visible .hs__dot { transform: scale(1.25); }
    .hs:hover .hs__label, .hs:focus-visible .hs__label {
      color: var(--gold-bright); border-color: var(--gold-soft); background: rgba(12,12,13,.82); transform: translateX(-50%) translateY(0);
    }
    .hs:focus-visible { outline: none; }
    .hs:focus-visible .hs__dot { box-shadow: 0 0 0 3px rgba(236,214,163,.5), 0 4px 14px rgba(0,0,0,.5); }
    .hs--primary .hs__dot { width: 20px; height: 20px; }
    .hs--primary .hs__label { border-color: rgba(200,161,91,.5); color: var(--gold-bright); }

    /* Social logos engraved on the bar's marble */
    .hs--brand { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
    .hs--brand .brandico {
      width: 29px; height: 29px; color: var(--gold-bright); opacity: .95;
      filter: drop-shadow(0 1px 1px rgba(255,255,255,.18)) drop-shadow(0 2px 5px rgba(0,0,0,.75));
      transition: transform .3s var(--ease), opacity .3s var(--ease), filter .3s var(--ease);
    }
    .hs--brand:hover .brandico, .hs--brand:focus-visible .brandico {
      transform: scale(1.12); opacity: 1;
      filter: drop-shadow(0 0 9px rgba(236,214,163,.6)) drop-shadow(0 2px 5px rgba(0,0,0,.6));
    }


    /* ---- Top bar ---- */
    .xbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 16px clamp(16px, 4vw, 40px); padding-top: calc(16px + env(safe-area-inset-top));
    }
    .xbar__brand img { height: 46px; width: auto; filter: drop-shadow(0 4px 12px rgba(0,0,0,.6)); }
    .xbar__right { display: flex; align-items: center; gap: clamp(10px, 2vw, 18px); }
    .lang { display: inline-flex; align-items: center; gap: 6px; color: var(--ivory-dim); }
    .lang__btn { font-family: var(--font-sans); font-size: .78rem; letter-spacing: .12em; color: var(--ivory-dim); padding: 2px; opacity: .6; transition: opacity .2s, color .2s; }
    .lang__btn.is-active { color: var(--gold-soft); opacity: 1; }
    .lang__sep { color: var(--muted); }
    .xbtn {
      font-family: var(--font-sans); font-weight: 500; font-size: .76rem; letter-spacing: .14em; text-transform: uppercase;
      padding: 11px 20px; border-radius: 2px; white-space: nowrap; border: 1px solid var(--line); color: var(--ivory);
      background: rgba(16,16,18,.42); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      transition: border-color .25s, color .25s, background .25s;
    }
    .xbtn:hover { border-color: var(--gold-soft); color: var(--gold-bright); }
    .xbtn--gold { background: var(--grad-gold); color: #231a0b; border: none; font-weight: 600; box-shadow: 0 10px 30px rgba(200,161,91,.28); }
    .xbtn--gold:hover { color: #231a0b; filter: brightness(1.06); }

    /* ---- HUD ---- */
    .hint {
      position: fixed; left: 50%; bottom: calc(68px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 15;
      display: flex; align-items: center; gap: 12px; font-family: var(--font-sans); font-weight: 400;
      font-size: .82rem; letter-spacing: .22em; text-transform: uppercase; color: var(--ivory-dim); transition: opacity .6s var(--ease);
    }
    .hint.is-hidden { opacity: 0; pointer-events: none; }
    .hint__arrow { color: var(--gold-soft); animation: hintSlide 1.8s var(--ease) infinite; display: inline-block; }
    .hint__arrow--l { animation-direction: reverse; }
    @keyframes hintSlide { 0%,100% { transform: translateX(0); opacity: .4; } 50% { transform: translateX(5px); opacity: 1; } }
    .caption {
      position: fixed; left: clamp(16px, 4vw, 40px); bottom: calc(26px + env(safe-area-inset-bottom)); z-index: 15;
      font-family: var(--font-sans); font-size: .74rem; letter-spacing: .04em; color: var(--muted); max-width: 46vw;
    }
    .caption a { color: var(--gold-soft); text-decoration: none; transition: color .25s var(--ease); }
    .caption a:hover { color: var(--gold-bright); }
    .scrub {
      position: fixed; right: clamp(16px, 4vw, 40px); bottom: calc(30px + env(safe-area-inset-bottom)); z-index: 15;
      width: clamp(90px, 18vw, 180px); height: 2px; border-radius: 2px; background: rgba(244,239,230,.16);
    }
    .scrub span { position: absolute; top: -1px; height: 4px; border-radius: 2px; background: var(--grad-gold); left: 0; width: 34%; }

    /* ---- Loader ---- */
    .loader { position: fixed; inset: 0; z-index: 60; background: var(--noir); display: grid; place-items: center; transition: opacity .8s var(--ease), visibility .8s; }
    .loader.is-done { opacity: 0; visibility: hidden; }
    .loader__inner { text-align: center; width: min(320px, 72vw); }
    .loader__mark { font-family: var(--font-display); font-weight: 400; font-size: 3.4rem; letter-spacing: .04em; background: var(--grad-gold); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 10px; }
    .loader__name { font-family: var(--font-sans); font-weight: 500; font-size: .76rem; letter-spacing: .4em; text-transform: uppercase; color: var(--ivory-dim); margin-bottom: 26px; }
    .loader__bar { height: 2px; background: rgba(244,239,230,.12); border-radius: 2px; overflow: hidden; }
    .loader__bar span { display: block; height: 100%; width: 0; background: var(--grad-gold); transition: width .25s linear; }
    .loader__pct { margin-top: 14px; font-family: var(--font-sans); font-size: .72rem; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }

    .stage, .xbar, .hint, .caption, .scrub { opacity: 0; transition: opacity 1s var(--ease) .1s; }
    body.is-ready .stage, body.is-ready .xbar, body.is-ready .caption, body.is-ready .scrub, body.is-ready .hint { opacity: 1; }

    @media (max-width: 720px) {
      .xbtn--site { display: none; }
      .caption { display: none; }
      .xbar__brand img { height: 38px; }
      .hint { font-size: .7rem; letter-spacing: .14em; text-align: center; max-width: 86vw; justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) { .hs__dot::before, .hs__dot::after, .hint__arrow { animation: none; } }
  </style>
</head>

    }
    $$(".lang__btn").forEach(function (b) { b.addEventListener("click", function () { applyLang(b.getAttribute("data-lang")); }); });
    if (followMode) {
      var hv = document.querySelector(".hint [data-i18n]"); if (hv) hv.setAttribute("data-i18n", "exp.hint.move");
    }
    applyLang(lang);

    /* ========== 3D immersive panorama (Three.js) ========== */
    var IMG = "assets/images/panorama-salon.jpg?v=2";
    var IMG_W = 2172, IMG_H = 724, ASPECT = IMG_W / IMG_H;

    // Cylinder wall the photo is wrapped on. Camera sits at the axis and rotates.
    var ARC = THREE.Math.degToRad(172);     // horizontal angular width of the scene
    var R = 12;                              // cylinder radius
    var VSTRETCH = 1.3;                      // extra vertical height -> room to look up/down
    var H = (R * ARC) / ASPECT * VSTRETCH;   // wall height
    var VARC = 2 * Math.atan((H / 2) / R);   // vertical angular size of the photo

    var stage = $("#stage"), mount = $("#scene");
    var scrubFill = $("#scrubFill"), hint = $("#hint"), hotspots = $$(".hs");

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0b0c);
    var camera = new THREE.PerspectiveCamera(46, 2, 0.1, 100);
    camera.rotation.order = "YXZ";
    camera.position.set(0, 0, 0);

    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    mount.appendChild(renderer.domElement);

    var mesh = null;
    var texLoaded = false;

    function buildMesh(tex) {
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      // BackSide mirrors the texture horizontally — flip it back so the room reads correctly.
      tex.wrapS = THREE.RepeatWrapping;
      tex.repeat.x = -1; tex.offset.x = 1;
      // Open cylinder arc, centred so its middle (theta = PI) faces -Z (the camera's forward).
      var geo = new THREE.CylinderGeometry(R, R, H, 160, 1, true, Math.PI - ARC / 2, ARC);
      var mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide });
      mesh = new THREE.Mesh(geo, mat);
      scene.add(mesh);
    }

    // Camera limits so we never look past the edges of the photo.
    var yawLimit, pitchLimit, pitchDown;
    function computeLimits() {
      var vFov = THREE.Math.degToRad(camera.fov);
      var hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      yawLimit = Math.max(0, (ARC / 2) - (hFov / 2) * 0.92);
      pitchLimit = Math.max(0, (VARC / 2) - (vFov / 2) * 0.96);
      // allow looking a little further DOWN than up (reach the table / magazine) without cutting the ceiling
      pitchDown = Math.max(pitchLimit, (VARC / 2) - (vFov / 2) * 0.64);
    }

    var curYaw = 0, curPitch = 0, tgtYaw = 0, tgtPitch = 0;
    var ease = reduce ? 1 : 0.07, interacted = false;

    function resize() {
      var w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      computeLimits();
      tgtYaw = clamp(tgtYaw, -yawLimit, yawLimit);
      tgtPitch = clamp(tgtPitch, -pitchDown, pitchLimit);
    }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    /* ---- Hotspot projection ---- */
    var _v = new THREE.Vector3();
    function placeHotspots() {
      var w = stage.clientWidth, h = stage.clientHeight;
      for (var i = 0; i < hotspots.length; i++) {
        var el = hotspots[i];
        var u = parseFloat(el.getAttribute("data-u"));
        var v = parseFloat(el.getAttribute("data-v"));
        var yaw = (u - 0.5) * ARC;          // column -> horizontal angle
        var pitch = (0.5 - v) * VARC;        // row -> vertical angle
        // direction in world space (-Z forward), matching the cylinder mapping
        _v.set(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch)).multiplyScalar(R);
        var fwd = _v.clone().normalize();
        _v.project(camera);
        // camera forward dot point-direction: hide if behind / out of view
        var camDir = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
        var inFront = fwd.dot(camDir) > 0.18;
        var x = (_v.x * 0.5 + 0.5) * w;
        var y = (-_v.y * 0.5 + 0.5) * h;
        if (inFront && _v.x >= -1.2 && _v.x <= 1.2 && _v.y >= -1.2 && _v.y <= 1.2) {
          el.classList.remove("is-hidden");
          el.style.transform = "translate3d(" + x + "px," + y + "px,0)";
        } else {
          el.classList.add("is-hidden");
        }
      }
    }

    function hideHint() { if (hint && !hint.classList.contains("is-hidden")) hint.classList.add("is-hidden"); }

    /* ---- Input: mouse-follow (desktop) + drag (all) ---- */
    if (followMode) {
      window.addEventListener("mousemove", function (e) {
        if (dragging) return;
        interacted = true; hideHint();
        var nx = clamp(e.clientX / stage.clientWidth, 0, 1);
        var ny = clamp(e.clientY / stage.clientHeight, 0, 1);
        tgtYaw = clamp((0.5 - nx) * 2 * yawLimit, -yawLimit, yawLimit);
        tgtPitch = clamp((0.5 - ny) * 2 * pitchDown, -pitchDown, pitchLimit);
      }, { passive: true });
    }

    var dragging = false, moved = false, lastX = 0, lastY = 0, dYaw = 0, dPitch = 0, lastT = 0;
    stage.addEventListener("pointerdown", function (e) {
      dragging = true; moved = false; stage.classList.add("is-grabbing");
      lastX = e.clientX; lastY = e.clientY; lastT = performance.now(); dYaw = dPitch = 0;
    });
    window.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var dx = e.clientX - lastX, dy = e.clientY - lastY;
      if (Math.abs(dx) + Math.abs(dy) > 3) { if (!moved) { moved = true; try { stage.setPointerCapture(e.pointerId); } catch (_) {} } interacted = true; hideHint(); }
      // drag sensitivity: full stage width ~ the full yaw span
      var kx = (2 * yawLimit) / stage.clientWidth * 0.6;
      var ky = (2 * pitchDown) / stage.clientHeight * 0.6;
      tgtYaw = clamp(tgtYaw + dx * kx, -yawLimit, yawLimit);
      tgtPitch = clamp(tgtPitch + dy * ky, -pitchDown, pitchLimit);
      var now = performance.now(), dt = now - lastT || 16;
      // cap the flick velocity so a fast swipe doesn't fling the camera across too fast
      dYaw = clamp(dx * kx / dt * 16, -0.008, 0.008); dPitch = dy * ky / dt * 16;
      lastX = e.clientX; lastY = e.clientY; lastT = now;
    }, { passive: true });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false; stage.classList.remove("is-grabbing");
      if (!reduce && !followMode && Math.abs(dYaw) > 0.0005) {
        (function glide() {
          dYaw *= 0.85; tgtYaw = clamp(tgtYaw + dYaw, -yawLimit, yawLimit);
          if (Math.abs(dYaw) > 0.0002) requestAnimationFrame(glide);
        })();
      }
      if (moved) {
        var killer = function (ev) { ev.preventDefault(); ev.stopPropagation(); };
        stage.addEventListener("click", killer, true);
        setTimeout(function () { stage.removeEventListener("click", killer, true); }, 0);
      }
    }
    window.addEventListener("pointerup", endDrag);
    window.addEventListener("pointercancel", endDrag);

    window.addEventListener("keydown", function (e) {
      var s = yawLimit * 0.5;
      if (e.key === "ArrowRight") { interacted = true; hideHint(); tgtYaw = clamp(tgtYaw + s, -yawLimit, yawLimit); }
      else if (e.key === "ArrowLeft") { interacted = true; hideHint(); tgtYaw = clamp(tgtYaw - s, -yawLimit, yawLimit); }
    });
    $$(".hs").forEach(function (h) { h.addEventListener("focus", function () { interacted = true; hideHint(); }); });

    window.addEventListener("resize", resize);

    /* ---- Loop ---- */
    function render() {
      camera.rotation.y = curYaw;
      camera.rotation.x = curPitch;
      renderer.render(scene, camera);
      if (yawLimit > 0) {
        var p = (curYaw + yawLimit) / (2 * yawLimit);
        var track = scrubFill.parentNode.clientWidth, wdt = Math.max(28, track * 0.28);
        scrubFill.style.width = wdt + "px"; scrubFill.style.left = (p * (track - wdt)) + "px";
      }
      placeHotspots();
    }
    (function loop() {
      if (!interacted && !reduce && texLoaded) {
        tgtYaw += 0.0012; if (tgtYaw > yawLimit || tgtYaw < -yawLimit) tgtYaw = clamp(tgtYaw, -yawLimit, yawLimit);
      }
      curYaw += (tgtYaw - curYaw) * ease;
      curPitch += (tgtPitch - curPitch) * ease;
      if (texLoaded) render();
      requestAnimationFrame(loop);
    })();

    /* ---- Loader ---- */
    var loader = $("#loader"), fill = $("#loaderFill"), pct = $("#loaderPct");
    var p = 0, loaded = false;
    function setP(v) { p = v; fill.style.width = v + "%"; pct.textContent = Math.round(v); }
    function reveal() {
      resize(); document.body.classList.add("is-ready"); loader.classList.add("is-done");
      if (!reduce) setTimeout(hideHint, 4800);
    }
    var ramp = setInterval(function () {
      var cap = loaded ? 100 : 90;
      var n = p + (cap - p) * 0.12 + 0.6; if (n >= cap) n = cap; setP(n);
      if (p >= 100) { clearInterval(ramp); setTimeout(reveal, 240); }
    }, 60);

    new THREE.TextureLoader().load(IMG, function (tex) {
      buildMesh(tex); texLoaded = true; loaded = true; resize();
    }, undefined, function () { loaded = true; });

    setTimeout(function () { loaded = true; }, 6000);
  })();
  </script>
</body>
</html>
